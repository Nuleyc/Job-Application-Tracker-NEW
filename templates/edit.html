<!DOCTYPE html>
<html>

<head>
    <title>Edit Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>Edit Application</h1>

        <form action="/update/{{ job.id }}" method="POST">
            <label>Company Name:</label><br>
            <input type="text" name="company_name" value="{{ job.company.name }}" required><br><br>

            <label>Position:</label><br>
            <input type="text" name="position" value="{{ job.position }}" required><br><br>

            <label>Status:</label><br>
            <select name="status">
                <option value="Applied" {% if job.status=="Applied" %}selected{% endif %}>Applied</option>
                <option value="Interview" {% if job.status=="Interview" %}selected{% endif %}>Interview</option>
                <option value="Offer" {% if job.status=="Offer" %}selected{% endif %}>Offer</option>
                <option value="Rejected" {% if job.status=="Rejected" %}selected{% endif %}>Rejected</option>
            </select><br><br>

            <label>Date Applied:</label><br>
            <input type="date" name="date_applied" value="{{ job.date_applied }}"><br><br>

            <label>Phone Number (optional):</label><br>
            <input type="text" name="phone_number" value="{{ job.phone_number or '' }}"><br><br>

            <label>Notes:</label><br>
            <textarea name="notes" rows="3" style="width:100%;">{{ job.notes or '' }}</textarea><br><br>

            <button type="submit">Save Changes</button>
        </form>

        <br>
        <a href="/">← Back to list</a>
    </div>
</body>

</html>
